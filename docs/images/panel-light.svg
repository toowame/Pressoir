<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 380 280" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <title>Pressoir — aperçu du panneau d'historique</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a15b"/>
      <stop offset="1" stop-color="#b8566f"/>
    </linearGradient>
  </defs>

  <rect x="10" y="8" width="360" height="262" rx="12" fill="#ffffff" stroke="#e5e5ea" filter="url(#shadow)"/>

  <!-- Search field -->
  <circle cx="30" cy="30" r="5" fill="none" stroke="#8e8e93" stroke-width="1.6"/>
  <line x1="33.6" y1="33.6" x2="37.5" y2="37.5" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="46" y="22" width="1.4" height="16" fill="#0a84ff"/>
  <text x="52" y="35" font-size="12.5" fill="#8e8e93">Rechercher dans l'historique</text>
  <line x1="10" y1="50" x2="370" y2="50" stroke="#e5e5ea"/>

  <!-- Row 1, selected -->
  <rect x="15" y="56" width="350" height="44" rx="7" fill="#0a84ff" fill-opacity="0.14"/>
  <text x="27" y="82" font-size="10" fill="#8e8e93">1</text>
  <text x="44" y="76" font-size="12.5" fill="#1d1d1f">Compte rendu : la réunion passe à 15 h, salle B</text>
  <text x="44" y="91" font-size="10" fill="#8e8e93">3 lignes</text>
  <path d="M344 70 l0 8 M340 70 h8 M342 66 h4 l-1 4 h-2 z" stroke="#8e8e93" fill="none" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M352 68 l6 6 M358 68 l-6 6" stroke="#8e8e93" stroke-width="1.2" stroke-linecap="round" transform="translate(0 3)"/>

  <!-- Row 2, image -->
  <text x="27" y="134" font-size="10" fill="#8e8e93">2</text>
  <rect x="44" y="106" width="92" height="40" rx="4" fill="url(#thumb)"/>
  <circle cx="62" cy="118" r="5" fill="#fff" fill-opacity="0.85"/>
  <path d="M44 146 l26 -18 l18 12 l14 -9 l34 15 z" fill="#5b1d3a" fill-opacity="0.75"/>
  <text x="44" y="160" font-size="10" fill="#8e8e93">Image · 1920 × 1080</text>

  <!-- Row 3, pinned -->
  <text x="27" y="187" font-size="10" fill="#8e8e93">3</text>
  <text x="44" y="187" font-size="12.5" fill="#1d1d1f">https://github.com/toowame/Pressoir</text>
  <path d="M344 179 l0 8 M340 179 h8 M342 175 h4 l-1 4 h-2 z" stroke="#0a84ff" fill="#0a84ff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Row 4 -->
  <text x="27" y="216" font-size="10" fill="#8e8e93">4</text>
  <text x="44" y="216" font-size="12.5" fill="#1d1d1f">06 12 34 56 78</text>

  <line x1="10" y1="244" x2="370" y2="244" stroke="#e5e5ea"/>
  <text x="190" y="261" font-size="10" fill="#8e8e93" text-anchor="middle">↩ coller · ⌘1–9 · ⌘P épingler · ⌘⌫ supprimer</text>
</svg>
