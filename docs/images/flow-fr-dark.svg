<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <title>Fonctionnement de Pressoir</title>
  <rect width="920" height="300" rx="16" fill="#0d1117"/>
  <rect x="20" y="20" width="880" height="122" rx="14" fill="#1a1116"/>
  <rect x="20" y="158" width="880" height="122" rx="14" fill="#1a1116"/>
  <text x="40" y="44" font-size="12" font-weight="600" letter-spacing="0.6" fill="#d27a9f">QUAND VOUS COPIEZ</text>
  <text x="40" y="182" font-size="12" font-weight="600" letter-spacing="0.6" fill="#d27a9f">QUAND VOUS TAPEZ ⇧⌘V</text>
  <rect x="40" y="56" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="135.0" y="87" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Vous copiez</text>
  <text x="135.0" y="109" font-size="11.5" fill="#a1a1a6" text-anchor="middle">un texte ou une image, partout</text>
  <path d="M236 93.0 h18 m-6 -5 l6 5 l-6 5" fill="none" stroke="#d27a9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="56" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="357.0" y="87" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Pressoir le voit</text>
  <text x="357.0" y="109" font-size="11.5" fill="#a1a1a6" text-anchor="middle">sondé toutes les 0,5 s</text>
  <path d="M458 93.0 h18 m-6 -5 l6 5 l-6 5" fill="none" stroke="#d27a9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="484" y="56" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="579.0" y="87" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Filtres</text>
  <text x="579.0" y="109" font-size="11.5" fill="#a1a1a6" text-anchor="middle">mots de passe, jetons, taille</text>
  <path d="M680 93.0 h18 m-6 -5 l6 5 l-6 5" fill="none" stroke="#d27a9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="706" y="56" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="801.0" y="87" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Scellé sur le disque</text>
  <text x="801.0" y="109" font-size="11.5" fill="#a1a1a6" text-anchor="middle">AES-256-GCM, clé au Trousseau</text>
  <rect x="40" y="194" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="135.0" y="225" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">⇧⌘V</text>
  <text x="135.0" y="247" font-size="11.5" fill="#a1a1a6" text-anchor="middle">depuis n&#39;importe où</text>
  <path d="M236 231.0 h18 m-6 -5 l6 5 l-6 5" fill="none" stroke="#d27a9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="194" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="357.0" y="225" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Panneau sous la souris</text>
  <text x="357.0" y="247" font-size="11.5" fill="#a1a1a6" text-anchor="middle">recherche, ↑ ↓, ⌘1…9</text>
  <path d="M458 231.0 h18 m-6 -5 l6 5 l-6 5" fill="none" stroke="#d27a9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="484" y="194" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="579.0" y="225" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Vous choisissez</text>
  <text x="579.0" y="247" font-size="11.5" fill="#a1a1a6" text-anchor="middle">ou épinglez, ou supprimez</text>
  <path d="M680 231.0 h18 m-6 -5 l6 5 l-6 5" fill="none" stroke="#d27a9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="706" y="194" width="190" height="74" rx="12" fill="#1c1c1e" stroke="#3a3a3c"/>
  <text x="801.0" y="225" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Collé</text>
  <text x="801.0" y="247" font-size="11.5" fill="#a1a1a6" text-anchor="middle">⌘V dans l&#39;app où vous étiez</text>
</svg>
