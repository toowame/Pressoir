name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, dev]

# Le jeton GitHub ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Format (swift-format, strict)
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build (Swift 6, concurrence stricte, warnings = erreurs)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Tests + couverture PressoirCore ≥ 80 %
        run: Scripts/check-coverage.sh 80
