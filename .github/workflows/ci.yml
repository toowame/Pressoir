name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Format (swift-format, strict)
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build (Swift 6, concurrence stricte, warnings = erreurs)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Tests + couverture PressoirCore ≥ 80 %
        run: Scripts/check-coverage.sh 80
